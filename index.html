<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Losowanie świadków na ślub Eli i Michała</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f6f1ed;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #292522;
}

.container {
    width: 90%;
    max-width: 500px;
    background: white;
    padding: 28px;
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    font-size: 27px;
    margin: 0 0 5px;
}

.subtitle {
    text-align: center;
    font-size: 18px;
    margin-bottom: 25px;
    color: #777;
}

/* LISTA IMION */

.lista {
    width: 100%;
    min-height: 180px;
    border: 1px solid #ddd;
    border-radius: 15px;
    padding: 18px;
    font-size: 18px;
    line-height: 1.8;
    background: #fff;
}

.lista div {
    text-align: center;
}

/* PRZYCISKI */

button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 17px;
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#losuj {
    background: #292522;
    color: white;
}

#losuj:disabled {
    opacity: 0.5;
}

#reset {
    background: #eee8e3;
    color: #292522;
}

/* WYNIKI */

#wynik {
    min-height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: 20px 0;
}

.osoba {
    margin: 10px 0;
    font-size: 26px;
    font-weight: 800;
}

.nazwa {
    font-size: 15px;
    color: #888;
    margin-bottom: 3px;
}

.losowanie {
    animation: puls 0.15s infinite alternate;
}

@keyframes puls {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.08);
    }
}


/* =========================
   EKRAN GRATULACJI
   ========================= */

.overlay {
    position: fixed;
    inset: 0;

    background: rgba(255,255,255,0.45);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    display: flex;
    justify-content: center;
    align-items: center;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.7s ease,
        visibility 0.7s ease;

    z-index: 100;
}

.overlay.show {
    opacity: 1;
    visibility: visible;
}


/* OKIENKO */

.gratulacje {
    width: 88%;
    max-width: 450px;

    background: rgba(255,255,255,0.96);

    border-radius: 28px;

    padding: 40px 25px;

    text-align: center;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.18);

    transform: scale(0.75);
    opacity: 0;

    transition:
        transform 0.7s cubic-bezier(.17,.67,.3,1.3),
        opacity 0.5s ease;
}

.overlay.show .gratulacje {
    transform: scale(1);
    opacity: 1;
}

.emoji {
    font-size: 45px;
    margin-bottom: 10px;
}

.gratulacje h2 {
    margin: 0;
    font-size: 32px;
    letter-spacing: 1px;
}

.tekst {
    margin-top: 20px;
    font-size: 18px;
    color: #777;
    line-height: 1.5;
}

.imiona-final {
    margin-top: 20px;
    font-size: 30px;
    font-weight: 800;
    line-height: 1.4;
}

.ampersand {
    font-size: 24px;
    font-weight: normal;
    margin: 0 5px;
}

.serduszko {
    margin-top: 18px;
    font-size: 25px;
}


/* MAŁY PRZYCISK ZAMKNIJ */

.zamknij {
    display: inline-block;

    width: auto;

    background: #f6f1ed;
    color: #777;

    border: 1px solid #e5ddd7;

    padding: 9px 20px;

    margin-top: 22px;

    font-size: 13px;
    font-weight: 500;

    border-radius: 20px;
}

.zamknij:hover {
    background: #eee8e3;
}

</style>
</head>

<body>

<div class="container">

    <h1>💍 Losowanie świadków</h1>

    <div class="subtitle">
        na ślub Eli i Michała
    </div>


    <!-- STAŁA LISTA IMION -->

    <div class="lista">

        <div>Zuza</div>
        <div>Szymon</div>
        <div>Dawid</div>
        <div>Michał</div>

    </div>


    <button id="losuj">
        🎲 LOSUJ ŚWIADKÓW
    </button>


    <div id="wynik">

        <div class="osoba">

            <div class="nazwa">
                Świadek
            </div>

            <div id="swiadek1">
                —
            </div>

        </div>


        <div class="osoba">

            <div class="nazwa">
                Świadek
            </div>

            <div id="swiadek2">
                —
            </div>

        </div>

    </div>


    <button id="reset">
        ZACZNIJ OD NOWA
    </button>

</div>


<!-- =========================
     GRATULACJE
     ========================= -->

<div class="overlay" id="overlay">

    <div class="gratulacje">

        <div class="emoji">
            🎉
        </div>

        <h2>
            GRATULACJE!
        </h2>


        <div class="tekst">
            Świadkami Eli i Michała<br>
            zostają:
        </div>


        <div class="imiona-final">

            <span id="final1"></span>

            <span class="ampersand">
                &
            </span>

            <span id="final2"></span>

        </div>


        <div class="serduszko">
            💍 ❤️ 🥂
        </div>


        <button class="zamknij" id="zamknij">
            ZAMKNIJ
        </button>

    </div>

</div>


<script>

/* =========================
   STAŁE IMIONA
   ========================= */

const wszystkieImiona = [
    "Zuza",
    "Szymon",
    "Dawid",
    "Michał"
];


/*
   Prawdziwa pula wyboru.
   Zuza jest na liście animacji,
   ale nie może zostać wybrana.
*/

let pula = [
    "Szymon",
    "Dawid",
    "Michał"
];


let animacjaTrwa = false;


const swiadek1 =
    document.getElementById("swiadek1");

const swiadek2 =
    document.getElementById("swiadek2");

const przycisk =
    document.getElementById("losuj");

const overlay =
    document.getElementById("overlay");

const final1 =
    document.getElementById("final1");

const final2 =
    document.getElementById("final2");


/* =========================
   ANIMACJA
   ========================= */

function animujLosowanie(element, callback) {

    let licznik = 0;

    const animacja = setInterval(function() {

        /*
           Podczas animacji losujemy wizualnie
           ze wszystkich czterech osób.
           Dlatego Zuza normalnie się pojawia.
        */

        const przypadkowe =
            wszystkieImiona[
                Math.floor(
                    Math.random() *
                    wszystkieImiona.length
                )
            ];

        element.textContent = przypadkowe;

        element.classList.add("losowanie");

        licznik++;


        if (licznik >= 28) {

            clearInterval(animacja);


            /*
               Końcowy wybór jest tylko z prawdziwej puli.
               Zuza nie może tutaj trafić.
            */

            const indeks =
                Math.floor(
                    Math.random() *
                    pula.length
                );


            const wybrane =
                pula[indeks];


            element.textContent =
                wybrane;

            element.classList.remove(
                "losowanie"
            );


            /*
               Usuwamy wybraną osobę,
               żeby drugi świadek był inny.
            */

            pula.splice(indeks, 1);


            callback();

        }

    }, 80);

}


/* =========================
   GRATULACJE
   ========================= */

function pokazGratulacje() {

    final1.textContent =
        swiadek1.textContent;

    final2.textContent =
        swiadek2.textContent;


    setTimeout(function() {

        overlay.classList.add("show");

    }, 600);

}


/* =========================
   LOSOWANIE
   ========================= */

function losuj() {

    if (animacjaTrwa) {
        return;
    }


    /*
       Muszą zostać minimum 2 osoby.
    */

    if (pula.length < 2) {

        alert(
            "Kliknij „ZACZNIJ OD NOWA”, aby wykonać nowe losowanie."
        );

        return;
    }


    animacjaTrwa = true;

    przycisk.disabled = true;


    swiadek1.textContent = "…";
    swiadek2.textContent = "…";


    /* PIERWSZY ŚWIADEK */

    animujLosowanie(
        swiadek1,
        function() {


            /*
               1,5 sekundy napięcia
               przed drugim losowaniem
            */

            setTimeout(function() {


                /* DRUGI ŚWIADEK */

                animujLosowanie(
                    swiadek2,
                    function() {

                        animacjaTrwa =
                            false;

                        przycisk.disabled =
                            false;


                        /*
                           Finał
                        */

                        pokazGratulacje();

                    }
                );


            }, 1500);

        }
    );

}


/* =========================
   START
   ========================= */

przycisk.addEventListener(
    "click",
    losuj
);


/* =========================
   ZAMKNIJ
   ========================= */

document.getElementById(
    "zamknij"
).addEventListener(
    "click",
    function() {

        overlay.classList.remove(
            "show"
        );

    }
);


/* =========================
   RESET
   ========================= */

document.getElementById(
    "reset"
).addEventListener(
    "click",
    function() {

        if (animacjaTrwa) {
            return;
        }


        /*
           Przywracamy pełną pulę
           bez Zuzy.
        */

        pula = [
            "Szymon",
            "Dawid",
            "Michał"
        ];


        swiadek1.textContent = "—";
        swiadek2.textContent = "—";


        overlay.classList.remove(
            "show"
        );

    }
);

</script>

</body>
</html>
