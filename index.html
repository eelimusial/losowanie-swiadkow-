<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Losowanie świadków na ślub Eli i Michała</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #fffdfb 0%,
            #f7f0eb 55%,
            #eee5df 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;

    color: #292522;
}


/* GŁÓWNA KARTA */

.container {
    width: 90%;
    max-width: 500px;

    background: rgba(255,255,255,0.92);

    padding: 32px 26px 28px;

    border-radius: 30px;

    box-shadow:
        0 15px 45px rgba(70,55,45,0.12);

    text-align: center;
}


/* TYTUŁ */

.ozdoba-gora {
    font-size: 24px;
    color: #a58b72;
    margin-bottom: 8px;
}

h1 {
    font-family: Georgia, "Times New Roman", serif;

    font-size: 29px;

    font-weight: 500;

    margin: 0;

    letter-spacing: 0.2px;
}

.subtitle {
    font-family: Georgia, "Times New Roman", serif;

    font-size: 18px;

    color: #8c8179;

    margin-top: 7px;

    margin-bottom: 27px;
}


/* LISTA IMION */

.lista-naglowek {
    font-size: 11px;

    letter-spacing: 2.5px;

    text-transform: uppercase;

    color: #a58b72;

    margin-bottom: 12px;
}

.lista {
    background: #fbf7f4;

    border-radius: 20px;

    padding: 10px 25px;

    border: 1px solid #eee3dc;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.8);
}

.imie {
    font-family: Georgia, "Times New Roman", serif;

    font-size: 22px;

    font-weight: 400;

    letter-spacing: 0.3px;

    padding: 10px 0;

    color: #403832;
}

.linia {
    width: 45px;

    height: 1px;

    background: #cbb9a6;

    margin: 0 auto;
}


/* PRZYCISK LOSOWANIA */

#losuj {
    width: 100%;

    border: none;

    border-radius: 16px;

    padding: 17px;

    margin-top: 22px;

    background: #292522;

    color: white;

    font-size: 17px;

    font-weight: 600;

    letter-spacing: 0.5px;

    cursor: pointer;

    box-shadow:
        0 8px 20px rgba(41,37,34,0.18);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

#losuj:active {
    transform: scale(0.98);
}

#losuj:disabled {
    opacity: 0.45;
}


/* WYNIKI */

#wynik {
    min-height: 155px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    margin: 17px 0 5px;
}

.osoba {
    margin: 8px 0;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 27px;

    font-weight: 500;

    color: #292522;
}

.nazwa {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    font-size: 11px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color: #a58b72;

    margin-bottom: 4px;
}


/* ANIMACJA IMION */

.losowanie {
    animation: puls 0.15s infinite alternate;
}

@keyframes puls {

    from {
        transform: scale(1);
        opacity: 0.65;
    }

    to {
        transform: scale(1.08);
        opacity: 1;
    }

}


/* RESET */

#reset {
    width: auto;

    border: none;

    background: transparent;

    color: #9a8d83;

    font-size: 12px;

    letter-spacing: 1px;

    padding: 8px 14px;

    margin-top: 5px;

    cursor: pointer;
}


/* =========================
   EKRAN GRATULACJI
   ========================= */

.overlay {
    position: fixed;

    inset: 0;

    background: rgba(245,239,234,0.48);

    backdrop-filter: blur(13px);

    -webkit-backdrop-filter: blur(13px);

    display: flex;

    justify-content: center;

    align-items: center;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.7s ease,
        visibility 0.7s ease;

    z-index: 100;
}

.overlay.show {
    opacity: 1;

    visibility: visible;
}


/* OKIENKO */

.gratulacje {
    width: 88%;

    max-width: 440px;

    background:
        linear-gradient(
            145deg,
            #fffefd,
            #faf4ef
        );

    border-radius: 30px;

    padding: 43px 25px 30px;

    text-align: center;

    box-shadow:
        0 25px 70px rgba(55,43,35,0.22);

    border: 1px solid rgba(190,166,143,0.35);

    transform: scale(0.72);

    opacity: 0;

    transition:
        transform 0.75s cubic-bezier(.17,.67,.3,1.3),
        opacity 0.5s ease;
}

.overlay.show .gratulacje {

    transform: scale(1);

    opacity: 1;

}


/* OZDOBNIK */

.emoji {
    font-size: 39px;

    margin-bottom: 8px;
}

.gratulacje h2 {

    font-family: Georgia, "Times New Roman", serif;

    font-size: 32px;

    font-weight: 500;

    letter-spacing: 1px;

    margin: 0;

    color: #292522;
}

.tekst {

    margin-top: 20px;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 18px;

    line-height: 1.55;

    color: #81756d;
}


/* IMIONA KOŃCOWE */

.imiona-final {

    margin-top: 19px;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 30px;

    font-weight: 600;

    color: #292522;

    line-height: 1.4;
}

.ampersand {

    font-size: 25px;

    font-weight: 400;

    color: #a58b72;

    margin: 0 6px;
}

.serduszko {

    margin-top: 18px;

    font-size: 23px;
}


/* MAŁY PRZYCISK ZAMKNIJ */

.zamknij {

    display: inline-block;

    width: auto;

    background: #f6f1ed;

    color: #96887e;

    border: 1px solid #e5dcd5;

    padding: 8px 18px;

    margin-top: 22px;

    font-size: 11px;

    font-weight: 500;

    letter-spacing: 1px;

    border-radius: 20px;

    cursor: pointer;
}

.zamknij:active {

    background: #eee5df;

}

</style>
</head>


<body>


<div class="container">


    <div class="ozdoba-gora">
        ♡
    </div>


    <h1>
        Losowanie świadków
    </h1>


    <div class="subtitle">
        na ślub Eli i Michała
    </div>


    <div class="lista-naglowek">
        Lista kandydatów
    </div>


    <!-- STAŁA LISTA IMION -->

    <div class="lista">

        <div class="imie">
            Zuza
        </div>

        <div class="linia"></div>

        <div class="imie">
            Szymon
        </div>

        <div class="linia"></div>

        <div class="imie">
            Dawid
        </div>

        <div class="linia"></div>

        <div class="imie">
            Michał
        </div>

    </div>


    <button id="losuj">
        🎲 &nbsp; LOSUJ ŚWIADKÓW
    </button>


    <div id="wynik">


        <div class="osoba">

            <div class="nazwa">
                Świadek
            </div>

            <div id="swiadek1">
                —
            </div>

        </div>


        <div class="osoba">

            <div class="nazwa">
                Świadek
            </div>

            <div id="swiadek2">
                —
            </div>

        </div>


    </div>


    <button id="reset">
        ZACZNIJ OD NOWA
    </button>


</div>



<!-- =========================
     EKRAN GRATULACJI
     ========================= -->

<div class="overlay" id="overlay">


    <div class="gratulacje">


        <div class="emoji">
            🎉
        </div>


        <h2>
            GRATULACJE!
        </h2>


        <div class="tekst">

            Świadkami Eli i Michała<br>

            zostają:

        </div>


        <div class="imiona-final">

            <span id="final1"></span>

            <span class="ampersand">
                &
            </span>

            <span id="final2"></span>

        </div>


        <div class="serduszko">
            💍 ❤️ 🥂
        </div>


        <button class="zamknij" id="zamknij">
            ZAMKNIJ
        </button>


    </div>


</div>



<script>


/* =========================
   STAŁA LISTA
   ========================= */

const wszystkieImiona = [

    "Zuza",
    "Szymon",
    "Dawid",
    "Michał"

];


/*
   Prawdziwa pula losowania.

   Zuza nie może zostać wybrana.
*/

let pula = [

    "Szymon",
    "Dawid",
    "Michał"

];


let animacjaTrwa = false;


const swiadek1 =
    document.getElementById("swiadek1");

const swiadek2 =
    document.getElementById("swiadek2");

const przycisk =
    document.getElementById("losuj");

const overlay =
    document.getElementById("overlay");

const final1 =
    document.getElementById("final1");

const final2 =
    document.getElementById("final2");


/* =========================
   ANIMACJA LOSOWANIA
   ========================= */

function animujLosowanie(
    element,
    callback
) {

    let licznik = 0;


    const animacja =
        setInterval(function() {


            /*
               Wszystkie cztery imiona
               mogą pojawiać się
               podczas animacji.
            */

            const przypadkowe =
                wszystkieImiona[
                    Math.floor(
                        Math.random() *
                        wszystkieImiona.length
                    )
                ];


            element.textContent =
                przypadkowe;


            element.classList.add(
                "losowanie"
            );


            licznik++;


            if (licznik >= 28) {


                clearInterval(
                    animacja
                );


                /*
                   Ostateczny wybór
                   tylko z prawdziwej puli.
                */

                const indeks =
                    Math.floor(
                        Math.random() *
                        pula.length
                    );


                const wybrane =
                    pula[indeks];


                element.textContent =
                    wybrane;


                element.classList.remove(
                    "losowanie"
                );


                /*
                   Usuwamy wybraną osobę,
                   aby nie mogła być
                   drugim świadkiem.
                */

                pula.splice(
                    indeks,
                    1
                );


                callback();

            }


        }, 80);

}


/* =========================
   GRATULACJE
   ========================= */

function pokazGratulacje() {


    final1.textContent =
        swiadek1.textContent;


    final2.textContent =
        swiadek2.textContent;


    setTimeout(function() {

        overlay.classList.add(
            "show"
        );

    }, 600);

}


/* =========================
   LOSOWANIE
   ========================= */

function losuj() {


    if (animacjaTrwa) {
        return;
    }


    if (pula.length < 2) {

        alert(
            "Kliknij „ZACZNIJ OD NOWA”, aby wykonać nowe losowanie."
        );

        return;

    }


    animacjaTrwa = true;

    przycisk.disabled = true;


    swiadek1.textContent =
        "…";

    swiadek2.textContent =
        "…";


    /*
       PIERWSZY ŚWIADEK
    */

    animujLosowanie(

        swiadek1,

        function() {


            /*
               Chwila napięcia
               przed drugim losowaniem.
            */

            setTimeout(

                function() {


                    /*
                       DRUGI ŚWIADEK
                    */

                    animujLosowanie(

                        swiadek2,

                        function() {


                            animacjaTrwa =
                                false;


                            przycisk.disabled =
                                false;


                            /*
                               Pokazujemy finał.
                            */

                            pokazGratulacje();

                        }

                    );


                },

                1500

            );

        }

    );

}


/* =========================
   START
   ========================= */

przycisk.addEventListener(
    "click",
    losuj
);


/* =========================
   ZAMKNIJ
   ========================= */

document.getElementById(
    "zamknij"
).addEventListener(

    "click",

    function() {

        overlay.classList.remove(
            "show"
        );

    }

);


/* =========================
   RESET
   ========================= */

document.getElementById(
    "reset"
).addEventListener(

    "click",

    function() {


        if (animacjaTrwa) {
            return;
        }


        /*
           Przywracamy pełną pulę
           prawdziwych kandydatów.
        */

        pula = [

            "Szymon",
            "Dawid",
            "Michał"

        ];


        swiadek1.textContent =
            "—";

        swiadek2.textContent =
            "—";


        overlay.classList.remove(
            "show"
        );

    }

);

</script>

</body>
</html>
