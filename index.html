<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> Świadkowie na ślub Eli i Michała</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f6f1ed;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #292522;
}

.container {
    width: 90%;
    max-width: 500px;
    background: white;
    padding: 28px;
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    box-sizing: border-box;
}

h1 {
    text-align: center;
    font-size: 27px;
    margin: 0 0 5px;
}

.subtitle {
    text-align: center;
    font-size: 18px;
    margin-bottom: 25px;
    color: #777;
}

textarea {
    width: 100%;
    height: 180px;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 15px;
    padding: 15px;
    font-size: 18px;
    resize: none;
}

button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 17px;
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#losuj {
    background: #292522;
    color: white;
}

#losuj:disabled {
    opacity: 0.5;
}

#reset {
    background: #eee8e3;
    color: #292522;
}

#wynik {
    min-height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: 20px 0;
}

.osoba {
    margin: 10px 0;
    font-size: 26px;
    font-weight: 800;
}

.nazwa {
    font-size: 15px;
    color: #888;
    margin-bottom: 3px;
}

.losowanie {
    animation: puls 0.15s infinite alternate;
}

@keyframes puls {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.08);
    }
}
</style>
</head>

<body>

<div class="container">

<h1>💍 Losowanie świadków</h1>

<div class="subtitle">
    na ślub Eli i Michała
</div>

<textarea id="imiona"
placeholder="Wpisz imiona, każde w osobnej linii"></textarea>

<button id="losuj">🎲 LOSUJ ŚWIADKÓW</button>

<div id="wynik">

    <div class="osoba">
        <div class="nazwa">Świadek</div>
        <div id="swiadkowa">—</div>
    </div>

    <div class="osoba">
        <div class="nazwa">Świadek</div>
        <div id="swiadek">—</div>
    </div>

</div>

<button id="reset">ZACZNIJ OD NOWA</button>

</div>

<script>

let pula = null;

const pole = document.getElementById("imiona");
const swiadkowa = document.getElementById("swiadkowa");
const swiadek = document.getElementById("swiadek");
const przycisk = document.getElementById("losuj");


function pobierzImiona() {

    return pole.value
        .split(/[\n,;]+/)
        .map(imie => imie.trim())
        .filter(imie => imie !== "")
        .filter(imie => imie.toLowerCase() !== "zuza");

}


function rozpocznij() {

    pula = pobierzImiona();

}


function animujLosowanie(element, callback) {

    let licznik = 0;

    const animacja = setInterval(function() {

        if (pula.length === 0) {
            clearInterval(animacja);
            return;
        }

        const przypadkowe =
            pula[Math.floor(Math.random() * pula.length)];

        element.textContent = przypadkowe;

        element.classList.add("losowanie");

        licznik++;

        if (licznik >= 18) {

            clearInterval(animacja);

            const indeks =
                Math.floor(Math.random() * pula.length);

            const wybrane = pula[indeks];

            element.textContent = wybrane;

            element.classList.remove("losowanie");

            pula.splice(indeks, 1);

            callback();

        }

    }, 80);

}


function losuj() {

    if (pula === null) {
        rozpocznij();
    }

    if (pula.length < 2) {

        alert("Potrzebne są co najmniej 2 osoby.");

        return;

    }

    przycisk.disabled = true;

    swiadkowa.textContent = "…";
    swiadek.textContent = "…";


    /* PIERWSZY ŚWIADEK */

    animujLosowanie(swiadkowa, function() {

        /* chwila napięcia */

        setTimeout(function() {

            /* DRUGI ŚWIADEK */

            animujLosowanie(swiadek, function() {

                przycisk.disabled = false;

            });

        }, 1200);

    });

}


przycisk.addEventListener("click", losuj);


/* RESET */

document.getElementById("reset").addEventListener("click", function() {

    rozpocznij();

    swiadkowa.textContent = "—";
    swiadek.textContent = "—";

    przycisk.disabled = false;

});


/* Zmiana listy osób = nowe losowanie */

pole.addEventListener("input", function() {

    pula = null;

    swiadkowa.textContent = "—";
    swiadek.textContent = "—";

});

</script>

</body>
</html>
