<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Losowanie świadków na ślub Eli i Michała</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f6f1ed;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #292522;
}

.container {
    width: 90%;
    max-width: 500px;
    background: white;
    padding: 28px;
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    transition: filter 0.6s ease;
}

h1 {
    text-align: center;
    font-size: 27px;
    margin: 0 0 5px;
}

.subtitle {
    text-align: center;
    font-size: 18px;
    margin-bottom: 25px;
    color: #777;
}

textarea {
    width: 100%;
    height: 180px;
    border: 1px solid #ddd;
    border-radius: 15px;
    padding: 15px;
    font-size: 18px;
    resize: none;
}

button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 17px;
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#losuj {
    background: #292522;
    color: white;
}

#losuj:disabled {
    opacity: 0.5;
}

#reset {
    background: #eee8e3;
    color: #292522;
}

#wynik {
    min-height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: 20px 0;
}

.osoba {
    margin: 10px 0;
    font-size: 26px;
    font-weight: 800;
}

.nazwa {
    font-size: 15px;
    color: #888;
    margin-bottom: 3px;
}

.losowanie {
    animation: puls 0.15s infinite alternate;
}

@keyframes puls {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.08);
    }
}


/* =========================
   EKRAN GRATULACJI
   ========================= */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    display: flex;
    justify-content: center;
    align-items: center;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.7s ease,
        visibility 0.7s ease;

    z-index: 100;
}

.overlay.show {
    opacity: 1;
    visibility: visible;
}

.gratulacje {
    width: 88%;
    max-width: 450px;
    background: rgba(255,255,255,0.95);
    border-radius: 28px;
    padding: 40px 25px;
    text-align: center;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.18);

    transform: scale(0.75);
    opacity: 0;

    transition:
        transform 0.7s cubic-bezier(.17,.67,.3,1.3),
        opacity 0.5s ease;
}

.overlay.show .gratulacje {
    transform: scale(1);
    opacity: 1;
}

.emoji {
    font-size: 45px;
    margin-bottom: 10px;
}

.gratulacje h2 {
    margin: 0;
    font-size: 32px;
    letter-spacing: 1px;
}

.gratulacje .tekst {
    margin-top: 20px;
    font-size: 18px;
    color: #777;
    line-height: 1.5;
}

.imiona-final {
    margin-top: 20px;
    font-size: 30px;
    font-weight: 800;
    line-height: 1.4;
}

.ampersand {
    font-size: 24px;
    font-weight: normal;
    margin: 0 5px;
}

.serduszka {
    margin-top: 18px;
    font-size: 25px;
}

.zamknij {
    margin-top: 25px;
    background: #292522;
    color: white;
}
</style>
</head>

<body>

<div class="container" id="glowny">

    <h1>💍 Losowanie świadków</h1>

    <div class="subtitle">
        na ślub Eli i Michała
    </div>

    <textarea
        id="imiona"
        placeholder="Wpisz imiona, każde w osobnej linii"></textarea>

    <button id="losuj">
        🎲 LOSUJ ŚWIADKÓW
    </button>

    <div id="wynik">

        <div class="osoba">
            <div class="nazwa">Świadek</div>
            <div id="swiadek1">—</div>
        </div>

        <div class="osoba">
            <div class="nazwa">Świadek</div>
            <div id="swiadek2">—</div>
        </div>

    </div>

    <button id="reset">
        ZACZNIJ OD NOWA
    </button>

</div>


<!-- =========================
     OKNO GRATULACJI
     ========================= -->

<div class="overlay" id="overlay">

    <div class="gratulacje">

        <div class="emoji">
            🎉
        </div>

        <h2>
            GRATULACJE!
        </h2>

        <div class="tekst">
            Świadkami Eli i Michała<br>
            zostają:
        </div>

        <div class="imiona-final">

            <span id="final1"></span>

            <span class="ampersand">
                &
            </span>

            <span id="final2"></span>

        </div>

        <div class="serduszka">
            💍 ❤️ 🥂
        </div>

        <button class="zamknij" id="zamknij">
            ZAMKNIJ
        </button>

    </div>

</div>


<script>

let pula = null;
let animacjaTrwa = false;

const pole = document.getElementById("imiona");

const swiadek1 =
    document.getElementById("swiadek1");

const swiadek2 =
    document.getElementById("swiadek2");

const przycisk =
    document.getElementById("losuj");

const overlay =
    document.getElementById("overlay");

const final1 =
    document.getElementById("final1");

const final2 =
    document.getElementById("final2");


/* =========================
   POBIERANIE IMION
   ========================= */

function pobierzImiona() {

    return pole.value
        .split(/[\n,;]+/)
        .map(imie => imie.trim())
        .filter(imie => imie !== "");

}


/* =========================
   PULA BEZ ZUZY
   ========================= */

function pobierzPuleDoLosowania() {

    return pula.filter(imie =>
        imie.toLowerCase() !== "zuza"
    );

}


/* =========================
   ANIMACJA LOSOWANIA
   ========================= */

function animujLosowanie(element, callback) {

    let licznik = 0;

    const wszystkieImiona =
        pobierzImiona();

    const animacja =
        setInterval(function() {

            if (wszystkieImiona.length === 0) {

                clearInterval(animacja);

                return;
            }

            const przypadkowe =
                wszystkieImiona[
                    Math.floor(
                        Math.random() *
                        wszystkieImiona.length
                    )
                ];

            element.textContent =
                przypadkowe;

            element.classList.add(
                "losowanie"
            );

            licznik++;

            if (licznik >= 25) {

                clearInterval(animacja);

                const prawdziwaPula =
                    pobierzPuleDoLosowania();

                if (prawdziwaPula.length === 0) {

                    element.textContent =
                        "Brak osób";

                    element.classList.remove(
                        "losowanie"
                    );

                    callback();

                    return;
                }

                const indeks =
                    Math.floor(
                        Math.random() *
                        prawdziwaPula.length
                    );

                const wybrane =
                    prawdziwaPula[indeks];

                element.textContent =
                    wybrane;

                element.classList.remove(
                    "losowanie"
                );

                const indeksWPuli =
                    pula.findIndex(
                        imie => imie === wybrane
                    );

                if (indeksWPuli !== -1) {

                    pula.splice(
                        indeksWPuli,
                        1
                    );

                }

                callback();

            }

        }, 80);

}


/* =========================
   ROZPOCZĘCIE
   ========================= */

function rozpocznij() {

    pula = pobierzImiona();

}


/* =========================
   POKAZANIE GRATULACJI
   ========================= */

function pokazGratulacje() {

    final1.textContent =
        swiadek1.textContent;

    final2.textContent =
        swiadek2.textContent;

    setTimeout(function() {

        overlay.classList.add("show");

    }, 500);

}


/* =========================
   LOSOWANIE
   ========================= */

function losuj() {

    if (animacjaTrwa) {
        return;
    }

    if (pula === null) {
        rozpocznij();
    }

    const prawdziwaPula =
        pobierzPuleDoLosowania();

    if (prawdziwaPula.length < 2) {

        alert(
            "Potrzebne są co najmniej 2 osoby."
        );

        return;
    }

    animacjaTrwa = true;

    przycisk.disabled = true;

    swiadek1.textContent = "…";
    swiadek2.textContent = "…";


    /* PIERWSZY ŚWIADEK */

    animujLosowanie(
        swiadek1,
        function() {

            setTimeout(
                function() {

                    /* DRUGI ŚWIADEK */

                    animujLosowanie(
                        swiadek2,
                        function() {

                            animacjaTrwa = false;

                            przycisk.disabled =
                                false;

                            /*
                               Po zakończeniu
                               drugiego losowania
                               pokazujemy finał.
                            */

                            pokazGratulacje();

                        }
                    );

                },
                1200
            );

        }
    );

}


/* =========================
   START LOSOWANIA
   ========================= */

przycisk.addEventListener(
    "click",
    losuj
);


/* =========================
   ZAMKNIĘCIE GRATULACJI
   ========================= */

document.getElementById(
    "zamknij"
).addEventListener(
    "click",
    function() {

        overlay.classList.remove(
            "show"
        );

    }
);


/* =========================
   RESET
   ========================= */

document.getElementById(
    "reset"
).addEventListener(
    "click",
    function() {

        if (animacjaTrwa) {
            return;
        }

        rozpocznij();

        swiadek1.textContent = "—";
        swiadek2.textContent = "—";

        overlay.classList.remove(
            "show"
        );

    }
);


/* =========================
   ZMIANA LISTY IMION
   ========================= */

pole.addEventListener(
    "input",
    function() {

        if (animacjaTrwa) {
            return;
        }

        pula = null;

        swiadek1.textContent = "—";
        swiadek2.textContent = "—";

    }
);

</script>

</body>
</html>
